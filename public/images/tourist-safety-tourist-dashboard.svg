<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#16233a"/>
    </linearGradient>
    <radialGradient id="glow2" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg2)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>

  <!-- mock map card -->
  <g transform="translate(90,120)">
    <rect width="620" height="560" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>
    <g stroke="#3b82f6" stroke-opacity="0.35" stroke-width="1.5">
      <path d="M0 140 H620"/>
      <path d="M0 260 H620"/>
      <path d="M0 380 H620"/>
      <path d="M160 0 V560"/>
      <path d="M340 0 V560"/>
      <path d="M480 0 V560"/>
    </g>
    <g transform="translate(300,300)">
      <circle r="70" fill="#3b82f6" fill-opacity="0.18"/>
      <circle r="10" fill="#3b82f6"/>
      <circle r="18" fill="none" stroke="#3b82f6" stroke-width="2"/>
    </g>
    <text x="30" y="46" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" fill-opacity="0.8">Live Location</text>
  </g>

  <!-- side panel: safety score + SOS -->
  <g transform="translate(760,120)">
    <rect width="350" height="560" rx="20" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.12"/>

    <text x="30" y="56" font-family="Georgia, serif" font-size="26" fill="#ffffff" font-weight="700">Safety Score</text>
    <circle cx="175" cy="170" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="16"/>
    <circle cx="175" cy="170" r="80" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round"
      stroke-dasharray="440" stroke-dashoffset="90" transform="rotate(-90 175 170)"/>
    <text x="175" y="180" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff" text-anchor="middle">82%</text>

    <rect x="30" y="300" width="290" height="1" fill="#ffffff" fill-opacity="0.12"/>
    <text x="30" y="340" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2" fill="#22c55e">STATUS: SAFE</text>

    <rect x="30" y="460" width="290" height="64" rx="32" fill="#ef4444"/>
    <text x="175" y="500" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">SOS EMERGENCY</text>
  </g>

  <text x="600" y="60" font-family="Georgia, serif" font-size="28" fill="#ffffff" text-anchor="middle" opacity="0.85">Tourist Dashboard</text>
  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
