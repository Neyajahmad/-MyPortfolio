<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a12"/>
      <stop offset="100%" stop-color="#132b1e"/>
    </linearGradient>
    <radialGradient id="glowN" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgN)"/>
  <rect width="1200" height="800" fill="url(#glowN)"/>

  <!-- ring dashes decorative -->
  <g stroke="#22c55e" stroke-opacity="0.25" fill="none">
    <circle cx="600" cy="255" r="150" stroke-width="1.5" stroke-dasharray="4 10"/>
  </g>

  <!-- apple/leaf icon -->
  <g transform="translate(600,255)">
    <circle r="86" fill="none" stroke="#22c55e" stroke-opacity="0.35" stroke-width="1.5"/>
    <!-- apple body -->
    <path d="M-6 -18 C -34 -30 -60 -10 -58 20 C -56 55 -28 82 0 82 C 28 82 56 55 58 20 C 60 -10 34 -30 6 -18 C 2 -22 -2 -22 -6 -18 Z" fill="url(#leafFill)"/>
    <!-- leaf -->
    <path d="M4 -20 C 8 -40 30 -46 42 -38 C 34 -22 16 -14 4 -20 Z" fill="#166534"/>
    <!-- stem -->
    <rect x="-3" y="-28" width="6" height="16" rx="3" fill="#166534"/>
    <!-- bite -->
    <circle cx="40" cy="10" r="16" fill="#0c1a12"/>
  </g>

  <text x="600" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#ffffff" text-anchor="middle">NutriTrack</text>
  <text x="600" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="5" fill="#22c55e" text-anchor="middle">AI POWERED NUTRITION &amp; FITNESS TRACKER</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e5e7eb" text-anchor="middle">
    <g transform="translate(600,540)">
      <rect x="-360" y="-22" width="130" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="-295" y="4">Kotlin</text>

      <rect x="-220" y="-22" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="-135" y="4">Firebase</text>

      <rect x="-40" y="-22" width="170" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="45" y="4">ML Kit</text>

      <rect x="140" y="-22" width="220" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="250" y="4">Gemini AI</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
