<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="100%" stop-color="#10192e"/>
    </linearGradient>
    <radialGradient id="glowT" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="padFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgT)"/>
  <rect width="1200" height="800" fill="url(#glowT)"/>

  <circle cx="600" cy="255" r="120" fill="none" stroke="#3b82f6" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- notepad icon -->
  <g transform="translate(600,255)">
    <rect x="-55" y="-75" width="110" height="150" rx="10" fill="url(#padFill)"/>
    <path d="M40 -75 L55 -60 L40 -60 Z" fill="#93c5fd"/>
    <g stroke="#0a1220" stroke-width="5" stroke-linecap="round">
      <line x1="-35" y1="-40" x2="25" y2="-40"/>
      <line x1="-35" y1="-15" x2="25" y2="-15"/>
      <line x1="-35" y1="10" x2="25" y2="10"/>
      <line x1="-35" y1="35" x2="5" y2="35"/>
    </g>
    <!-- pencil -->
    <g transform="translate(48,50) rotate(45)">
      <rect x="-8" y="-50" width="16" height="80" rx="4" fill="#fbbf24"/>
      <path d="M-8 -50 L0 -66 L8 -50 Z" fill="#f59e0b"/>
      <rect x="-8" y="30" width="16" height="10" fill="#e5e7eb"/>
    </g>
  </g>

  <text x="600" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#ffffff" text-anchor="middle">Notes App</text>
  <text x="600" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" letter-spacing="5" fill="#3b82f6" text-anchor="middle">KOTLIN ANDROID NOTES APP</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e5e7eb" text-anchor="middle">
    <g transform="translate(600,540)">
      <rect x="-230" y="-22" width="140" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="-160" y="4">Kotlin</text>

      <rect x="-80" y="-22" width="180" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="10" y="4">Android Studio</text>

      <rect x="110" y="-22" width="130" height="40" rx="20" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="175" y="4">SQLite</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="798" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
</svg>
